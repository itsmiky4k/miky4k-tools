<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miky.4k — Assistente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #07040e;
    --deep: #0e0916;
    --surface: #130d1e;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --violet: #b08ff5;
    --rose: #f4a0d4;
    --orange: #f4956a;
    --text: #f0e8f5;
    --muted: #7a6490;
    --dim: #3d2f50;
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 45% at 10% 15%, rgba(176,143,245,0.09) 0%, transparent 70%),
      radial-gradient(ellipse 45% 55% at 88% 75%, rgba(244,149,106,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 55% 35% at 55% 45%, rgba(244,160,212,0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 28px 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: baseline; gap: 14px; }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .logo span {
    background: linear-gradient(90deg, var(--violet), var(--rose), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-style: italic;
  }

  .tagline {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .btn-clear-chat {
    background: none;
    border: 1px solid var(--dim);
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-clear-chat:hover { border-color: var(--orange); color: var(--orange); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.5s ease both;
  }

  .welcome-icon {
    font-size: 32px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .welcome-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--violet), var(--rose), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .welcome-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    line-height: 1.8;
    max-width: 400px;
    margin: 0 auto 28px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .suggestion {
    padding: 8px 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .suggestion:hover {
    border-color: rgba(176,143,245,0.35);
    color: var(--violet);
    background: rgba(176,143,245,0.06);
  }

  /* Message bubbles */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    margin-top: 2px;
  }

  .msg-avatar.ai {
    background: linear-gradient(135deg, rgba(176,143,245,0.2), rgba(244,160,212,0.15));
    border: 1px solid rgba(176,143,245,0.3);
    color: var(--violet);
  }

  .msg-avatar.user {
    background: linear-gradient(135deg, rgba(244,149,106,0.2), rgba(244,160,212,0.15));
    border: 1px solid rgba(244,149,106,0.3);
    color: var(--orange);
  }

  .msg-content {
    max-width: 75%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .message.user .msg-content { align-items: flex-end; }

  .msg-bubble {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.75;
    white-space: pre-wrap;
  }

  .message.ai .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-top-left-radius: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 300;
  }

  .message.user .msg-bubble {
    background: linear-gradient(135deg, rgba(176,143,245,0.15), rgba(244,149,106,0.10));
    border: 1px solid rgba(176,143,245,0.25);
    color: var(--text);
    border-top-right-radius: 4px;
  }

  .msg-time {
    font-size: 8px;
    color: var(--dim);
    letter-spacing: 0.1em;
    padding: 0 4px;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease both;
  }

  .typing-dots {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    border-top-left-radius: 4px;
  }

  .typing-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--violet);
    animation: typingPulse 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; background: var(--rose); }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; background: var(--orange); }

  @keyframes typingPulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* Input area */
  .input-area {
    padding: 16px 0 28px;
    flex-shrink: 0;
    border-top: 1px solid var(--glass-border);
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: rgba(176,143,245,0.4);
  }

  #userInput {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 24px;
    padding: 2px 0;
  }

  #userInput::placeholder { color: var(--muted); }

  .btn-send {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, rgba(176,143,245,0.25), rgba(244,149,106,0.15));
    border: 1px solid rgba(176,143,245,0.4);
    border-radius: 7px;
    color: var(--violet);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-send:hover { color: var(--rose); border-color: var(--rose); }
  .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

  .input-hint {
    font-size: 8px;
    color: var(--dim);
    letter-spacing: 0.12em;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="app">
  <header>
    <div class="header-left">
      <div class="logo">miky<span>.4k</span></div>
      <div class="tagline">Assistente — SOFT_STATE</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <a href="index.html" class="btn-clear-chat" style="text-decoration:none;">← Hub</a>
      <button class="btn-clear-chat" onclick="clearChat()">✕ Nuova chat</button>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <div class="welcome-title">Ciao, sono il tuo assistente</div>
      <div class="welcome-sub">Sono il tuo consulente creativo e strategico. Brainstorming, nuovi progetti, direzioni creative, business, crescita — parliamo di tutto.</div>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">Ho un'idea per un nuovo progetto, parliamone</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Come posso monetizzare la mia arte?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Brainstorming su una nuova serie</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Come trovare collaborazioni nel mondo creativo?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Tendenze nell'arte digitale 3D nel 2025</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Come strutturare un portfolio professionale?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Scrivi un messaggio..." rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">→</button>
    </div>
    <div class="input-hint">Invio per inviare · Shift+Invio per andare a capo</div>
  </div>
</div>

<script>
  const PROXY = 'https://miky4k-proxy.vercel.app/api/claude';

  const SYSTEM = `Sei il consulente creativo e strategico personale di miky.4k, artista digitale e graphic designer italiano con una forte identità visiva dark e onirica.
Il tuo ruolo è essere un partner di pensiero a tutto tondo: brainstorming su nuovi progetti, direzioni creative, strategie di crescita, business, monetizzazione, collaborazioni, tool e workflow, tendenze nel mondo dell'arte digitale, del design e dei social media.
Non sei limitato a nessun tema specifico — sei un consulente che pensa in grande, fa domande giuste, propone idee concrete e dà feedback onesto e diretto.
Conosci bene il mondo dell'arte digitale 3D, del graphic design, dei social media (Instagram, TikTok, Behance), del business creativo e delle tecnologie emergenti (AI, generative art, NFT, strumenti 3D).
Parli in italiano. Sei diretto, mai compiacente, mai generico. Quando fai brainstorming vai in profondità, non ti fermi alla superficie.`;

  let history = [];
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendSuggestion(btn) {
    document.getElementById('userInput').value = btn.textContent;
    sendMessage();
  }

  function clearChat() {
    history = [];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <div class="welcome-title">Ciao, sono il tuo assistente</div>
        <div class="welcome-sub">Sono il tuo consulente creativo e strategico. Brainstorming, nuovi progetti, direzioni creative, business, crescita — parliamo di tutto.</div>
        <div class="suggestions">
          <button class="suggestion" onclick="sendSuggestion(this)">Ho un'idea per un nuovo progetto, parliamone</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Come posso monetizzare la mia arte?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Brainstorming su una nuova serie</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Come trovare collaborazioni nel mondo creativo?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Tendenze nell'arte digitale 3D nel 2025</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Come strutturare un portfolio professionale?</button>
        </div>
      </div>`;
  }

  function now() {
    return new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, text) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = role === 'ai' ? '✦' : 'M';
    div.innerHTML = `
      <div class="msg-avatar ${role}">${avatar}</div>
      <div class="msg-content">
        <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
        <div class="msg-time">${now()}</div>
      </div>`;

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function showTyping() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="msg-avatar ai">✦</div>
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isLoading) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    showTyping();

    try {
      const response = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: SYSTEM,
          messages: history
        })
      });

      const data = await response.json();
      hideTyping();

      if (!data.content || !Array.isArray(data.content)) {
        throw new Error(data.error?.message || 'Errore API');
      }

      const reply = data.content.map(i => i.text || '').join('').trim();
      history.push({ role: 'assistant', content: reply });
      appendMessage('ai', reply);

    } catch (err) {
      hideTyping();
      appendMessage('ai', 'Errore: ' + err.message);
      console.error(err);
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').focus();
    }
  }
</script>
</body>
</html>
