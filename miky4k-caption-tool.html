<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miky.4k — Caption Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #07040e;
  --deep: #0e0916;
  --surface: #130d1e;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --violet: #b08ff5;
  --rose: #f4a0d4;
  --orange: #f4956a;
  --accent: #e07bb5;
  --text: #f0e8f5;
  --muted: #7a6490;
  --dim: #3d2f50;
}
html, body { height: 100%; background: var(--void); color: var(--text); font-family: 'Space Mono', monospace; overflow-x: hidden; }
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 65% 45% at 10% 15%, rgba(176,143,245,0.10) 0%, transparent 70%),
    radial-gradient(ellipse 45% 55% at 88% 75%, rgba(244,149,106,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 55% 35% at 55% 45%, rgba(244,160,212,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 30% 40% at 30% 85%, rgba(224,123,181,0.05) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.grain {
  position: fixed; inset: 0; opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px; pointer-events: none; z-index: 0;
}
.container { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 60px 24px 80px; }

/* Header */
header { margin-bottom: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.header-left { display: flex; align-items: baseline; gap: 16px; }
.btn-hub {
  background: none; border: 1px solid var(--dim); border-radius: 6px; color: var(--muted);
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 7px 14px; cursor: pointer; text-decoration: none; transition: all 0.2s; display: inline-block; flex-shrink: 0;
}
.btn-hub:hover { border-color: var(--violet); color: var(--violet); }
.logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; letter-spacing: 0.05em; color: var(--text); }
.logo span { background: linear-gradient(90deg, var(--violet), var(--rose), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-style: italic; }
.tagline { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; padding: 12px 14px;
  outline: none; transition: border-color 0.2s, background 0.2s; width: 100%; appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: rgba(176,143,245,0.45); background: rgba(176,143,245,0.05); }
textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
select option { background: #1a1030; color: var(--text); }

/* Image upload */
.upload-zone {
  border: 1px dashed var(--dim); border-radius: 8px; padding: 28px 20px; text-align: center;
  transition: all 0.3s; background: var(--glass); margin-bottom: 16px;
}
.upload-zone:hover { border-color: rgba(176,143,245,0.4); background: rgba(176,143,245,0.04); }
.upload-zone input[type="file"] { display: none; }
.upload-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
.upload-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 10px; }
.upload-sub { font-size: 9px; color: var(--dim); letter-spacing: 0.1em; display: block; margin-bottom: 16px; }
.btn-upload {
  display: inline-block; padding: 10px 22px;
  background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,160,212,0.12));
  border: 1px solid rgba(176,143,245,0.35); border-radius: 6px; color: var(--violet);
  font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
}
.btn-upload:hover { color: var(--rose); border-color: var(--rose); }
.preview-wrap { display: none; position: relative; margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid var(--glass-border); }
.preview-wrap img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.preview-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,4,14,0.88) 0%, transparent 55%); display: flex; align-items: flex-end; padding: 16px; gap: 10px; }
.btn-analyze {
  padding: 8px 18px; background: linear-gradient(135deg, rgba(176,143,245,0.25), rgba(244,160,212,0.18));
  border: 1px solid rgba(176,143,245,0.4); border-radius: 4px; color: var(--violet);
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
}
.btn-analyze:hover { color: var(--rose); border-color: var(--rose); }
.btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-clear {
  padding: 8px 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--dim); border-radius: 4px;
  color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.btn-clear:hover { color: var(--text); border-color: var(--muted); }
.analyze-status { font-size: 9px; letter-spacing: 0.12em; color: var(--rose); margin-left: auto; }

.section-label {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim);
  margin-bottom: 12px; margin-top: 4px; display: flex; align-items: center; gap: 10px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--dim); opacity: 0.4; }

/* Tabs */
.tabs { display: flex; gap: 2px; margin-bottom: 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px; padding: 3px; }
.tab { flex: 1; padding: 8px; background: none; border: none; border-radius: 4px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
.tab.active { background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,149,106,0.12)); color: var(--rose); }

/* Tone pills */
.tone-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tone-pill {
  padding: 8px 14px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px;
  color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.tone-pill:hover { border-color: rgba(176,143,245,0.35); color: var(--text); }
.tone-pill.selected { background: linear-gradient(135deg, rgba(176,143,245,0.2), rgba(244,149,106,0.12)); border-color: rgba(176,143,245,0.55); color: var(--rose); }
.tone-pill .tone-name { display: block; }
.tone-pill .tone-desc { display: block; font-size: 8px; letter-spacing: 0.04em; color: var(--dim); font-family: 'Cormorant Garamond', serif; font-style: italic; text-transform: none; margin-top: 2px; }
.tone-pill.selected .tone-desc { color: var(--muted); }

/* Generate button */
.btn-generate {
  width: 100%; margin-top: 8px; padding: 16px;
  background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,160,212,0.12), rgba(244,149,106,0.10));
  border: 1px solid rgba(176,143,245,0.35); border-radius: 6px; color: var(--rose);
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
}
.btn-generate:hover { border-color: rgba(244,149,106,0.5); color: var(--orange); }
.btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

/* Loading */
.loading { display: none; text-align: center; padding: 48px; color: var(--muted); font-size: 11px; letter-spacing: 0.2em; }
.pulse { display: inline-block; width: 6px; height: 6px; background: linear-gradient(135deg, var(--violet), var(--rose)); border-radius: 50%; margin: 0 3px; animation: pulse 1.2s ease-in-out infinite; }
.pulse:nth-child(2) { animation-delay: 0.2s; background: linear-gradient(135deg, var(--rose), var(--orange)); }
.pulse:nth-child(3) { animation-delay: 0.4s; background: linear-gradient(135deg, var(--orange), var(--violet)); }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

/* Output */
.output { display: none; margin-top: 40px; }
.output-section { margin-bottom: 20px; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; animation: fadeUp 0.4s ease both; }
.output-section:nth-child(2) { animation-delay: 0.08s; }
.output-section:nth-child(3) { animation-delay: 0.16s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.output-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--glass); border-bottom: 1px solid var(--glass-border); }
.output-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.copy-btn { background: none; border: 1px solid var(--dim); border-radius: 4px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 10px; cursor: pointer; transition: all 0.2s; }
.copy-btn:hover { border-color: var(--violet); color: var(--violet); }
.copy-btn.copied { border-color: var(--rose); color: var(--rose); }
.output-body { padding: 20px; background: var(--surface); font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 300; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.output-body.mono { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.9; }
.alt-text { color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.7; }

/* Output tabs */
.output-tabs { display: flex; gap: 2px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px; padding: 3px; margin-bottom: 20px; }
.output-tab { flex: 1; padding: 8px; background: none; border: none; border-radius: 4px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
.output-tab.active { background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,149,106,0.12)); color: var(--rose); }
.output-panel { display: none; }
.output-panel.active { display: block; }

/* Review */
.review-score { display: flex; align-items: center; gap: 12px; padding: 20px; background: var(--surface); border-bottom: 1px solid var(--glass-border); }
.score-number { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 300; line-height: 1; background: linear-gradient(135deg, var(--violet), var(--rose), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.score-meta { display: flex; flex-direction: column; gap: 4px; }
.score-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.score-verdict { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: var(--text); }
.review-body { padding: 20px; background: var(--surface); font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 300; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.review-edit { padding: 20px; background: rgba(176,143,245,0.04); border-top: 1px solid rgba(176,143,245,0.12); font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 300; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.review-edit-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--violet); margin-bottom: 12px; display: block; }
.btn-review { width: 100%; margin-top: 8px; padding: 12px; background: rgba(176,143,245,0.06); border: 1px dashed rgba(176,143,245,0.25); border-radius: 6px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; }
.btn-review:hover { border-color: rgba(176,143,245,0.5); color: var(--violet); }
.btn-review:disabled { opacity: 0.3; cursor: not-allowed; }

.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--violet), var(--rose), var(--orange), transparent); opacity: 0.3; margin: 32px 0; }

/* Profile badge */
.profile-badge { display: none; font-size: 9px; color: var(--violet); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; padding: 8px 12px; background: rgba(176,143,245,0.06); border: 1px solid rgba(176,143,245,0.15); border-radius: 6px; }

@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .field.full { grid-column: 1; } }
</style>
</head>
<body>
<div class="grain"></div>
<div class="container">
  <header>
    <div class="header-left">
      <div class="logo">miky<span>.4k</span></div>
      <div class="tagline">Caption Studio</div>
    </div>
    <a class="btn-hub" href="index.html">← Hub</a>
  </header>

  <!-- Platform tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setTab('instagram', this)">Instagram</button>
    <button class="tab" onclick="setTab('tiktok', this)">TikTok</button>
  </div>
  <input type="hidden" id="platform" value="instagram">

  <!-- Image upload -->
  <div class="section-label">Analisi immagine</div>
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" />
    <div class="upload-icon">✦</div>
    <span class="upload-label">Carica l'opera</span>
    <span class="upload-sub">jpg, png, webp — il tool la analizzerà e compilerà i campi automaticamente</span>
    <button class="btn-upload" onclick="document.getElementById('imageInput').click()">Scegli immagine</button>
  </div>
  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" src="" alt="preview" />
    <div class="preview-overlay">
      <button class="btn-analyze" id="analyzeBtn" onclick="analyzeImage()">✦ Analizza immagine</button>
      <button class="btn-clear" onclick="clearImage()">Rimuovi</button>
      <span class="analyze-status" id="analyzeStatus"></span>
    </div>
  </div>

  <!-- Tone -->
  <div class="section-label">Tono della caption</div>
  <div class="tone-grid">
    <button class="tone-pill selected" onclick="setTone('amichevole', this)"><span class="tone-name">Amichevole</span><span class="tone-desc">caldo, vicino, accessibile</span></button>
    <button class="tone-pill" onclick="setTone('poetico', this)"><span class="tone-name">Poetico</span><span class="tone-desc">evocativo, immagini sospese</span></button>
    <button class="tone-pill" onclick="setTone('pop', this)"><span class="tone-name">Pop</span><span class="tone-desc">energico, diretto, virale</span></button>
    <button class="tone-pill" onclick="setTone('narrativo', this)"><span class="tone-name">Narrativo</span><span class="tone-desc">racconta una storia</span></button>
    <button class="tone-pill" onclick="setTone('concettuale', this)"><span class="tone-name">Concettuale</span><span class="tone-desc">spiega l'idea dietro</span></button>
    <button class="tone-pill" onclick="setTone('intimo', this)"><span class="tone-name">Intimo</span><span class="tone-desc">personale, confessionale</span></button>
    <button class="tone-pill" onclick="setTone('minimalista', this)"><span class="tone-name">Minimalista</span><span class="tone-desc">pochissime parole, massimo impatto</span></button>
    <button class="tone-pill" onclick="setTone('fresco', this)"><span class="tone-name">Fresco</span><span class="tone-desc">leggero, spontaneo, giovane</span></button>
    <button class="tone-pill" onclick="setTone('promozionale', this)"><span class="tone-name">Promozionale</span><span class="tone-desc">lancia, vende, annuncia</span></button>
  </div>

  <!-- Details -->
  <div class="section-label">Dettagli</div>
  <div class="form-grid">
    <div class="field">
      <label>Opera / Titolo</label>
      <input type="text" id="title" placeholder="es. Titolo o numero dell'opera" />
    </div>
    <div class="field">
      <label>Serie (se parte di una serie)</label>
      <input type="text" id="series" placeholder="es. SOFT_STATE, VOID GARDEN..." />
    </div>
    <div class="field">
      <label>Tipo di contenuto</label>
      <select id="contentType">
        <option value="foto statica">Foto statica</option>
        <option value="carosello">Carosello</option>
        <option value="reel">Reel</option>
        <option value="reel AI">Reel AI</option>
        <option value="clay render reel">Clay Render Reel</option>
        <option value="building up reel">Building Up Reel</option>
        <option value="animazione 3D">Animazione 3D</option>
        <option value="post promozionale">Post promozionale</option>
        <option value="annuncio">Annuncio / lancio</option>
      </select>
    </div>
    <div class="field">
      <label>Mood / Emozione dominante</label>
      <input type="text" id="mood" placeholder="es. onirico, vulnerabile, sacro" />
    </div>
    <div class="field full">
      <label>Descrivi la scena / concept</label>
      <textarea id="concept" placeholder="es. figura femminile sospesa tra fiori bioluminescenti, luce viola/rosa, atmosfera eterea..."></textarea>
    </div>
    <div class="field">
      <label>Software / Tecnica usata</label>
      <input type="text" id="software" placeholder="es. Blender, Cinema4D, Unreal, AI..." />
    </div>
    <div class="field">
      <label>Lingua della caption</label>
      <select id="language">
        <option value="italiano">Italiano</option>
        <option value="inglese">Inglese</option>
        <option value="italiano e inglese">Italiano + Inglese</option>
      </select>
    </div>
    <div class="field full">
      <label>Note aggiuntive (opzionale)</label>
      <textarea id="notes" placeholder="es. inizia con una domanda, evita parole come 'journey', menziona la disponibilità per commissioni, max 3 righe..." style="min-height: 70px;"></textarea>
    </div>
  </div>

  <button class="btn-generate" id="generateBtn" onclick="generate()">
    ✦ Genera Caption + Hashtag + Alt Text
  </button>

  <div class="loading" id="loading">
    <span class="pulse"></span><span class="pulse"></span><span class="pulse"></span>
    <br><br>composing...
  </div>

  <div class="output" id="output">
    <div class="divider"></div>
    <div class="output-tabs">
      <button class="output-tab active" onclick="setOutputTab('results', this)">Caption & Hashtag</button>
      <button class="output-tab" onclick="setOutputTab('review', this)">Review ✦</button>
    </div>
    <!-- Panel: results -->
    <div class="output-panel active" id="panel-results">
      <div class="output-section">
        <div class="output-header"><span class="output-label">Caption</span><button class="copy-btn" onclick="copyText('captionText', this)">Copy</button></div>
        <div class="output-body" id="captionText"></div>
      </div>
      <div class="output-section">
        <div class="output-header"><span class="output-label">Hashtag</span><button class="copy-btn" onclick="copyText('hashtagText', this)">Copy</button></div>
        <div class="output-body mono" id="hashtagText"></div>
      </div>
      <div class="output-section">
        <div class="output-header"><span class="output-label">Alt Text</span><button class="copy-btn" onclick="copyText('altText', this)">Copy</button></div>
        <div class="output-body mono alt-text" id="altText"></div>
      </div>
    </div>
    <!-- Panel: review -->
    <div class="output-panel" id="panel-review">
      <div class="profile-badge" id="profileBadge"></div>
      <button class="btn-review" id="reviewBtn" onclick="generateReview()">✦ Analizza e critica la caption</button>
      <div class="output-section" id="reviewSection" style="display:none; margin-top:16px;">
        <div class="review-score">
          <div class="score-number" id="scoreNumber">—</div>
          <div class="score-meta"><span class="score-label">Score / 10</span><span class="score-verdict" id="scoreVerdict"></span></div>
        </div>
        <div class="output-header"><span class="output-label">Analisi critica</span><button class="copy-btn" onclick="copyText('reviewBody', this)">Copy</button></div>
        <div class="review-body" id="reviewBody"></div>
        <div class="review-edit"><span class="review-edit-label">✦ Versione migliorata</span><div id="reviewEdit"></div></div>
      </div>
    </div>
  </div>
</div>

// ─── State ─────────────────────────────────────────────────
let currentTab = 'instagram';
let currentTone = 'amichevole';
let uploadedImageBase64 = null;
let uploadedImageType = null;

// ─── Style Profile (ora su Supabase, fallback localStorage) ─
let styleProfile = {};

async function loadStyleProfile() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/style_profile?limit=1`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if (Array.isArray(rows) && rows.length > 0) {
      styleProfile = rows[0].data || {};
    } else {
      // fallback localStorage per migrazione
      styleProfile = JSON.parse(localStorage.getItem('miky4k_style_profile') || '{}');
    }
  } catch {
    styleProfile = JSON.parse(localStorage.getItem('miky4k_style_profile') || '{}');
  }
  updateProfileBadge();
}

async function saveStyleProfile() {
  try {
    // upsert — crea se non esiste, aggiorna se esiste
    await fetch(`${SUPABASE_URL}/rest/v1/style_profile`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ id: 1, data: styleProfile })
    });
    // mantieni anche localStorage come backup
    localStorage.setItem('miky4k_style_profile', JSON.stringify(styleProfile));
  } catch {
    localStorage.setItem('miky4k_style_profile', JSON.stringify(styleProfile));
  }
}

function getStyleProfilePrompt() {
  if (!styleProfile.strengths?.length && !styleProfile.weaknesses?.length) return '';
  let prompt = '\n\nSTILE APPRESO DALLE REVIEW PRECEDENTI (tienine conto):';
  if (styleProfile.strengths?.length) prompt += `\nPunti di forza da mantenere: ${styleProfile.strengths.join('; ')}`;
  if (styleProfile.weaknesses?.length) prompt += `\nDebolezze da evitare: ${styleProfile.weaknesses.join('; ')}`;
  if (styleProfile.avoid?.length) prompt += `\nPattern da non ripetere: ${styleProfile.avoid.join('; ')}`;
  if (styleProfile.bestExamples?.length) prompt += `\nEsempio di caption eccellente:\n"${styleProfile.bestExamples[styleProfile.bestExamples.length - 1]}"`;
  return prompt;
}

// ─── UI helpers ────────────────────────────────────────────
function setTab(tab, el) {
  currentTab = tab;
  document.getElementById('platform').value = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function setOutputTab(tab, el) {
  document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.output-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

function setTone(tone, el) {
  currentTone = tone;
  document.querySelectorAll('.tone-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
}

function updateProfileBadge() {
  const total = (styleProfile.strengths?.length || 0) + (styleProfile.weaknesses?.length || 0) + (styleProfile.avoid?.length || 0);
  const badge = document.getElementById('profileBadge');
  if (badge) {
    badge.textContent = total > 0 ? `✦ Profilo attivo — ${total} pattern appresi` : '';
    badge.style.display = total > 0 ? 'block' : 'none';
  }
}

function copyText(id, btn) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copiato ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── Image ─────────────────────────────────────────────────
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    uploadedImageBase64 = dataUrl.split(',')[1];
    uploadedImageType = file.type || 'image/jpeg';
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('uploadZone').style.display = 'none';
    document.getElementById('previewWrap').style.display = 'block';
    document.getElementById('analyzeStatus').textContent = '';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedImageBase64 = null;
  uploadedImageType = null;
  document.getElementById('imageInput').value = '';
  document.getElementById('previewImg').src = '';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('previewWrap').style.display = 'none';
  document.getElementById('analyzeStatus').textContent = '';
}

async function analyzeImage() {
  if (!uploadedImageBase64) return;
  const btn = document.getElementById('analyzeBtn');
  const status = document.getElementById('analyzeStatus');
  btn.disabled = true;
  status.textContent = 'analizzando...';

  const systemPrompt = `Sei un critico d'arte specializzato in arte digitale e visiva contemporanea. Analizza l'immagine e rispondi SOLO con JSON valido, nessun testo aggiuntivo, nessun markdown.

Estrai:
- "concept": descrizione della scena in italiano, dettagliata, elementi visivi principali, atmosfera, simbolismo percepito (max 60 parole)
- "mood": 3-4 aggettivi separati da virgola che descrivono l'emozione dominante (in italiano)
- "title_suggestion": suggerimento breve per titolo artistico basato sull'immagine (es. "VOID 003 — LIMINAL")
- "series_hint": se l'immagine suggerisce un tema di serie, indicalo (es. "corpo e spazio", "natura sintetica") o stringa vuota`;

  try {
    const data = await callAPI({
      model: 'claude-sonnet-4-6',
      max_tokens: 600,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: [{
          type: 'image',
          source: { type: 'base64', media_type: uploadedImageType, data: uploadedImageBase64 }
        }, { type: 'text', text: 'Analizza questa immagine.' }]
      }]
    });
    const raw = data.content.map(i => i.text || '').join('').trim();
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    if (parsed.concept) document.getElementById('concept').value = parsed.concept;
    if (parsed.mood) document.getElementById('mood').value = parsed.mood;
    if (parsed.title_suggestion && !document.getElementById('title').value) document.getElementById('title').value = parsed.title_suggestion;
    if (parsed.series_hint && !document.getElementById('series').value) document.getElementById('series').value = parsed.series_hint;
    status.textContent = '✓ analisi completata';
  } catch (err) {
    status.textContent = 'errore analisi';
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

// ─── API call ──────────────────────────────────────────────
async function callAPI(body, retries = 3) {
  for (let i = 0; i < retries; i++) {
    const response = await fetch(PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Proxy-Secret': PROXY_SECRET
      },
      body: JSON.stringify(body)
    });
    const data = await response.json();
    if (data.error?.type === 'overloaded_error') {
      if (i < retries - 1) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); continue; }
      throw new Error('Server sovraccarico, riprova tra qualche secondo.');
    }
    if (!data.content || !Array.isArray(data.content)) throw new Error(data.error?.message || JSON.stringify(data));
    return data;
  }
}

// ─── Generate caption ──────────────────────────────────────
async function generate() {
  const title = document.getElementById('title').value.trim();
  const series = document.getElementById('series').value.trim();
  const contentType = document.getElementById('contentType').value;
  const concept = document.getElementById('concept').value.trim();
  const mood = document.getElementById('mood').value.trim();
  const software = document.getElementById('software').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const platform = document.getElementById('platform').value;
  const language = document.getElementById('language').value;

  if (!concept && !title) {
    alert('Inserisci almeno un titolo o una descrizione del concept.');
    return;
  }

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('output').style.display = 'none';

  // Costruisci il contesto dell'opera
  let workContext = '';
  if (title) workContext += `\nTitolo: ${title}`;
  if (series) workContext += `\nSerie: ${series}`;
  if (contentType) workContext += `\nTipo di contenuto: ${contentType}`;
  if (concept) workContext += `\nDescrizione / concept: ${concept}`;
  if (mood) workContext += `\nMood / emozioni dominanti: ${mood}`;
  if (software) workContext += `\nSoftware / tecnica: ${software}`;
  if (notes) workContext += `\nNote specifiche: ${notes}`;

  const toneDescriptions = {
    amichevole: 'caldo, vicino, accessibile — come parlare a un amico',
    poetico: 'evocativo, immagini sospese, linguaggio ricercato ma non ermetico',
    pop: 'energico, diretto, virale — ritmo veloce, frasi corte, punch',
    narrativo: 'racconta una storia con un arco narrativo chiaro',
    concettuale: 'spiega l\'idea concettuale dietro l\'opera, il processo creativo',
    intimo: 'personale, confessionale — il tuo stato d\'animo mentre creavi',
    minimalista: 'pochissime parole, massimo impatto — ogni parola pesa',
    fresco: 'leggero, spontaneo, tono giovane e contemporaneo',
    promozionale: 'annuncia, lancia, invita all\'azione — chiaro e convincente senza essere aggressivo'
  };

  const platformRules = platform === 'instagram'
    ? 'Instagram: max 2200 caratteri, inizia forte (le prime 2 righe devono catturare), usa una call to action naturale, emoji opzionali ma non obbligatorie.'
    : 'TikTok: stile più diretto e immediato, max 150 caratteri per il corpo principale, poi hashtag separati, tono informale.';

  const systemPrompt = `Sei un copywriter creativo specializzato in arte digitale contemporanea e comunicazione social per artisti visivi. Il tuo compito è scrivere caption, hashtag e alt text per post di un artista digitale su ${platform}.

REGOLE PIATTAFORMA: ${platformRules}

TONO RICHIESTO: ${currentTone} — ${toneDescriptions[currentTone]}

LINGUA: Scrivi in ${language}.

STRUTTURA CAPTION: Il testo deve essere autentico, mai generico. Non usare frasi fatte come "questo progetto mi ha trasformato", "journey", "questo è il mio modo di esprimere". Vai diretto al contenuto dell'opera.

HASHTAG — REGOLA CRITICA: Genera SEMPRE hashtag specifici e diversificati basati sul contenuto reale dell'opera. Devi bilanciare:
- 5-6 hashtag di NICCHIA molto specifici (es. #3dartist, #blenderrender, #digitalartwork, basati su tecnica/mood/contenuto visivo reale)
- 4-5 hashtag MEDI (es. #digitalart, #3ddesign, #artofinstagram)  
- 3-4 hashtag LARGHI/DISCOVERY (es. #art, #design, #creative)
- 1-2 hashtag legati alla SERIE o al BRAND se indicati
Totale: 15-25 hashtag. NON usare sempre gli stessi hashtag generici. Adatta i tag al tono, al contenuto visivo, al mood e al tipo di contenuto specificato.
${getStyleProfilePrompt()}

Rispondi SOLO con JSON valido:
{
  "caption": "testo della caption",
  "hashtags": "lista hashtag separati da spazio",
  "alt_text": "descrizione accessibile dell'immagine per screen reader, in italiano, max 125 caratteri"
}`;

  const userMsg = `Crea la caption per questa opera:${workContext}`;

  try {
    const messages = [{ role: 'user', content: uploadedImageBase64 ? [
      { type: 'image', source: { type: 'base64', media_type: uploadedImageType, data: uploadedImageBase64 } },
      { type: 'text', text: userMsg }
    ] : userMsg }];

    const data = await callAPI({ model: 'claude-sonnet-4-6', max_tokens: 1200, system: systemPrompt, messages });
    const raw = data.content.map(i => i.text || '').join('').trim();
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    document.getElementById('captionText').textContent = parsed.caption || '';
    document.getElementById('hashtagText').textContent = parsed.hashtags || '';
    document.getElementById('altText').textContent = parsed.alt_text || '';
    document.getElementById('output').style.display = 'block';
    document.getElementById('reviewSection').style.display = 'none';
    document.getElementById('reviewBtn').textContent = '✦ Analizza e critica la caption';

    // Reset output tab
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.output-panel').forEach(p => p.classList.remove('active'));
    document.querySelector('.output-tab').classList.add('active');
    document.getElementById('panel-results').classList.add('active');

  } catch (err) {
    alert('Errore: ' + err.message);
    console.error(err);
  } finally {
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('loading').style.display = 'none';
  }
}

// ─── Review ────────────────────────────────────────────────
async function generateReview() {
  const caption = document.getElementById('captionText').textContent.trim();
  if (!caption) return;
  const btn = document.getElementById('reviewBtn');
  btn.disabled = true;
  btn.textContent = '✦ analizzando...';
  document.getElementById('reviewSection').style.display = 'none';

  const systemPrompt = `Sei un direttore creativo brutalmente onesto specializzato in social media per artisti digitali.
Analizza la caption fornita. Rispondi SOLO con JSON valido:
{
  "score": numero intero 1-10,
  "verdict": frase secca max 8 parole in inglese,
  "analysis": analisi critica onesta in inglese — cosa funziona, cosa non funziona. Max 120 parole. Sii diretto.,
  "improved": versione migliorata della caption in inglese,
  "strengths": array 1-3 stringhe brevi in inglese (es. "strong opening hook"),
  "weaknesses": array 1-3 stringhe brevi in inglese (es. "too many adjectives"),
  "avoid": array 1-2 pattern da evitare in futuro
}`;

  try {
    const data = await callAPI({
      model: 'claude-sonnet-4-6',
      max_tokens: 1200,
      system: systemPrompt,
      messages: [{ role: 'user', content: `Analizza questa caption:\n\n${caption}` }]
    });
    const raw = data.content.map(i => i.text || '').join('').trim();
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    document.getElementById('scoreNumber').textContent = parsed.score;
    document.getElementById('scoreVerdict').textContent = parsed.verdict;
    document.getElementById('reviewBody').textContent = parsed.analysis;
    document.getElementById('reviewEdit').textContent = parsed.improved;
    document.getElementById('reviewSection').style.display = 'block';

    // Aggiorna profilo di stile
    if (!styleProfile.strengths) styleProfile.strengths = [];
    if (!styleProfile.weaknesses) styleProfile.weaknesses = [];
    if (!styleProfile.avoid) styleProfile.avoid = [];
    if (!styleProfile.bestExamples) styleProfile.bestExamples = [];
    if (parsed.strengths) { parsed.strengths.forEach(s => { if (!styleProfile.strengths.includes(s)) styleProfile.strengths.push(s); }); styleProfile.strengths = styleProfile.strengths.slice(-6); }
    if (parsed.weaknesses) { parsed.weaknesses.forEach(w => { if (!styleProfile.weaknesses.includes(w)) styleProfile.weaknesses.push(w); }); styleProfile.weaknesses = styleProfile.weaknesses.slice(-6); }
    if (parsed.avoid) { parsed.avoid.forEach(a => { if (!styleProfile.avoid.includes(a)) styleProfile.avoid.push(a); }); styleProfile.avoid = styleProfile.avoid.slice(-4); }
    if (parsed.score >= 8) { styleProfile.bestExamples.push(caption); styleProfile.bestExamples = styleProfile.bestExamples.slice(-3); }
    await saveStyleProfile();
    updateProfileBadge();
  } catch (err) {
    console.error('Review error:', err);
    btn.textContent = 'errore: ' + err.message.slice(0, 40);
  } finally {
    btn.disabled = false;
    btn.textContent = '↺ Rigenera analisi';
  }
}

// ─── Init ──────────────────────────────────────────────────
loadStyleProfile();
</script>
