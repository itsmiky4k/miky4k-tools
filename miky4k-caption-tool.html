<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miky.4k — Caption Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #07040e;
    --deep: #0e0916;
    --surface: #130d1e;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --violet: #b08ff5;
    --rose: #f4a0d4;
    --orange: #f4956a;
    --accent: #e07bb5;
    --text: #f0e8f5;
    --muted: #7a6490;
    --dim: #3d2f50;
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 45% at 10% 15%, rgba(176,143,245,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 45% 55% at 88% 75%, rgba(244,149,106,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 55% 35% at 55% 45%, rgba(244,160,212,0.07) 0%, transparent 65%),
      radial-gradient(ellipse 30% 40% at 30% 85%, rgba(224,123,181,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-left { display: flex; align-items: baseline; gap: 16px; }

  .btn-hub {
    background: none;
    border: 1px solid var(--dim);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 7px 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    display: inline-block;
    flex-shrink: 0;
  }
  .btn-hub:hover { border-color: var(--violet); color: var(--violet); }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .logo span {
    background: linear-gradient(90deg, var(--violet), var(--rose), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-style: italic;
  }

  .tagline {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Form area */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input, select, textarea {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
    appearance: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: rgba(176,143,245,0.45);
    background: rgba(176,143,245,0.05);
  }

  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

  select option { background: #1a1030; color: var(--text); }

  /* Image upload */
  .upload-zone {
    border: 1px dashed var(--dim);
    border-radius: 8px;
    padding: 28px 20px;
    text-align: center;
    transition: all 0.3s;
    background: var(--glass);
    margin-bottom: 16px;
  }
  .upload-zone:hover { border-color: rgba(176,143,245,0.4); background: rgba(176,143,245,0.04); }
  .upload-zone input[type="file"] { display: none; }
  .upload-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
  .upload-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 10px;
  }
  .upload-sub { font-size: 9px; color: var(--dim); letter-spacing: 0.1em; display: block; margin-bottom: 16px; }
  .btn-upload {
    display: inline-block;
    padding: 10px 22px;
    background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,160,212,0.12));
    border: 1px solid rgba(176,143,245,0.35);
    border-radius: 6px;
    color: var(--violet);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-upload:hover { color: var(--rose); border-color: var(--rose); }

  .preview-wrap {
    display: none;
    position: relative;
    margin-bottom: 16px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
  }
  .preview-wrap img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .preview-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(7,4,14,0.88) 0%, transparent 55%);
    display: flex;
    align-items: flex-end;
    padding: 16px;
    gap: 10px;
  }
  .btn-analyze {
    padding: 8px 18px;
    background: linear-gradient(135deg, rgba(176,143,245,0.25), rgba(244,160,212,0.18));
    border: 1px solid rgba(176,143,245,0.4);
    border-radius: 4px;
    color: var(--violet);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-analyze:hover { color: var(--rose); border-color: var(--rose); }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-clear {
    padding: 8px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--dim);
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-clear:hover { color: var(--text); border-color: var(--muted); }
  .analyze-status { font-size: 9px; letter-spacing: 0.12em; color: var(--rose); margin-left: auto; }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--dim);
    opacity: 0.4;
  }

  /* Generate button */
  .btn-generate {
    width: 100%;
    margin-top: 8px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,160,212,0.12), rgba(244,149,106,0.10));
    border: 1px solid rgba(176,143,245,0.35);
    border-radius: 6px;
    color: var(--rose);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-generate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(176,143,245,0.15), rgba(244,160,212,0.10), rgba(244,149,106,0.08));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-generate:hover::before { opacity: 1; }
  .btn-generate:hover { border-color: rgba(244,149,106,0.5); color: var(--orange); }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    background: linear-gradient(135deg, var(--violet), var(--rose));
    border-radius: 50%;
    margin: 0 3px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .pulse:nth-child(2) { animation-delay: 0.2s; background: linear-gradient(135deg, var(--rose), var(--orange)); }
  .pulse:nth-child(3) { animation-delay: 0.4s; background: linear-gradient(135deg, var(--orange), var(--violet)); }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Output */
  .output { display: none; margin-top: 40px; }

  .output-section {
    margin-bottom: 20px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .output-section:nth-child(2) { animation-delay: 0.08s; }
  .output-section:nth-child(3) { animation-delay: 0.16s; }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--glass);
    border-bottom: 1px solid var(--glass-border);
  }

  .output-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--dim);
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover { border-color: var(--violet); color: var(--violet); }
  .copy-btn.copied { border-color: var(--rose); color: var(--rose); }

  .output-body {
    padding: 20px;
    background: var(--surface);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .output-body.mono {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.9;
  }

  .hashtag {
    background: linear-gradient(90deg, var(--violet), var(--rose), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .alt-text { color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.7; }

  /* Platform tabs */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    padding: 3px;
  }

  .tab {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,149,106,0.12));
    color: var(--rose);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--violet), var(--rose), var(--orange), transparent);
    opacity: 0.3;
    margin: 32px 0;
  }

  /* Tone selector */
  .tone-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tone-pill {
    padding: 8px 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tone-pill:hover {
    border-color: rgba(176,143,245,0.35);
    color: var(--text);
  }

  .tone-pill.selected {
    background: linear-gradient(135deg, rgba(176,143,245,0.2), rgba(244,149,106,0.12));
    border-color: rgba(176,143,245,0.55);
    color: var(--rose);
  }

  .tone-pill .tone-name { display: block; }
  .tone-pill .tone-desc {
    display: block;
    font-size: 8px;
    letter-spacing: 0.04em;
    color: var(--dim);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    text-transform: none;
    margin-top: 2px;
  }
  .tone-pill.selected .tone-desc { color: var(--muted); }

  /* Review tab */
  .output-tabs {
    display: flex;
    gap: 2px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    padding: 3px;
    margin-bottom: 20px;
  }

  .output-tab {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .output-tab.active {
    background: linear-gradient(135deg, rgba(176,143,245,0.18), rgba(244,149,106,0.12));
    color: var(--rose);
  }

  .output-panel { display: none; }
  .output-panel.active { display: block; }

  /* Review specific styles */
  .review-score {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--glass-border);
  }

  .score-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 300;
    line-height: 1;
    background: linear-gradient(135deg, var(--violet), var(--rose), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .score-meta { display: flex; flex-direction: column; gap: 4px; }
  .score-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .score-verdict { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: var(--text); }

  .review-body {
    padding: 20px;
    background: var(--surface);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .review-edit {
    padding: 20px;
    background: rgba(176,143,245,0.04);
    border-top: 1px solid rgba(176,143,245,0.12);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .review-edit-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--violet);
    margin-bottom: 12px;
    display: block;
  }

  .btn-review {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    background: rgba(176,143,245,0.06);
    border: 1px dashed rgba(176,143,245,0.25);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-review:hover { border-color: rgba(176,143,245,0.5); color: var(--violet); }
  .btn-review:disabled { opacity: 0.3; cursor: not-allowed; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="container">

  <header>
    <div class="header-left">
      <div class="logo">miky<span>.4k</span></div>
      <div class="tagline">Caption Studio — SOFT_STATE Series</div>
    </div>
    <a class="btn-hub" href="index.html">← Hub</a>
  </header>

  <!-- Platform tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setTab('instagram')">Instagram</button>
    <button class="tab" onclick="setTab('tiktok')">TikTok</button>
  </div>

  <input type="hidden" id="platform" value="instagram">

  <!-- Image upload -->
  <div class="section-label">Analisi immagine</div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" />
    <div class="upload-icon">✦</div>
    <span class="upload-label">Carica l'opera</span>
    <span class="upload-sub">jpg, png, webp — il tool la analizzerà e compilerà i campi</span>
    <button class="btn-upload" onclick="document.getElementById('imageInput').click()">Scegli immagine</button>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" src="" alt="preview" />
    <div class="preview-overlay">
      <button class="btn-analyze" id="analyzeBtn" onclick="analyzeImage()">✦ Analizza opera</button>
      <button class="btn-clear" onclick="clearImage()">Rimuovi</button>
      <span class="analyze-status" id="analyzeStatus"></span>
    </div>
  </div>

  <div class="section-label">Tono della caption</div>

  <div class="tone-grid">
    <button class="tone-pill selected" onclick="setTone('amichevole', this)">
      <span class="tone-name">Amichevole</span>
      <span class="tone-desc">caldo, vicino, accessibile</span>
    </button>
    <button class="tone-pill" onclick="setTone('poetico', this)">
      <span class="tone-name">Poetico</span>
      <span class="tone-desc">evocativo, immagini sospese</span>
    </button>
    <button class="tone-pill" onclick="setTone('pop', this)">
      <span class="tone-name">Pop</span>
      <span class="tone-desc">energico, diretto, virale</span>
    </button>
    <button class="tone-pill" onclick="setTone('narrativo', this)">
      <span class="tone-name">Narrativo</span>
      <span class="tone-desc">racconta una storia</span>
    </button>
    <button class="tone-pill" onclick="setTone('concettuale', this)">
      <span class="tone-name">Concettuale</span>
      <span class="tone-desc">spiega l'idea dietro</span>
    </button>
    <button class="tone-pill" onclick="setTone('intimo', this)">
      <span class="tone-name">Intimo</span>
      <span class="tone-desc">personale, confessionale</span>
    </button>
    <button class="tone-pill" onclick="setTone('minimalista', this)">
      <span class="tone-name">Minimalista</span>
      <span class="tone-desc">pochissime parole, massimo impatto</span>
    </button>
    <button class="tone-pill" onclick="setTone('fresco', this)">
      <span class="tone-name">Fresco</span>
      <span class="tone-desc">leggero, spontaneo, giovane</span>
    </button>
  </div>

  <div class="section-label">Dettagli</div>

  <!-- Form -->
  <div class="form-grid">
    <div class="field">
      <label>Opera / Titolo</label>
      <input type="text" id="title" placeholder="es. SOFT_STATE 004A" />
    </div>
    <div class="field">
      <label>Tipo di contenuto</label>
      <select id="contentType">
        <option value="foto statica">Foto statica</option>
        <option value="carosello">Carosello</option>
        <option value="reel AI">Reel AI</option>
        <option value="clay render reel">Clay Render Reel</option>
        <option value="building up reel">Building Up Reel</option>
        <option value="animazione 3D finale">Animazione 3D finale</option>
      </select>
    </div>
    <div class="field full">
      <label>Descrivi la scena / concept (anche in italiano)</label>
      <textarea id="concept" placeholder="es. figura femminile sospesa tra fiori bioluminescenti, vulnerabilità e trascendenza, luce viola/rosa, farfalle..."></textarea>
    </div>
    <div class="field">
      <label>Mood / Emozione dominante</label>
      <input type="text" id="mood" placeholder="es. onirico, vulnerabile, sacro" />
    </div>
    <div class="field">
      <label>Software usati</label>
      <input type="text" id="software" placeholder="es. Blender, Cinema4D, Unreal..." />
    </div>
    <div class="field full">
      <label>Note per la caption (opzionale)</label>
      <textarea id="notes" placeholder="es. inizia con una domanda, evita parole come 'journey', menziona che è parte di una serie, max 3 righe..." style="min-height: 70px;"></textarea>
    </div>
  </div>

  <button class="btn-generate" id="generateBtn" onclick="generate()">
    ✦ Genera Caption + Hashtag + Alt Text
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <span class="pulse"></span><span class="pulse"></span><span class="pulse"></span>
    <br><br>composing...
  </div>

  <!-- Output -->
  <div class="output" id="output">
    <div class="divider"></div>

    <!-- Output tabs -->
    <div class="output-tabs">
      <button class="output-tab active" onclick="setOutputTab('results')">Caption & Hashtag</button>
      <button class="output-tab" onclick="setOutputTab('review')">Review ✦</button>
    </div>

    <!-- Panel: results -->
    <div class="output-panel active" id="panel-results">
      <div class="output-section">
        <div class="output-header">
          <span class="output-label">Caption</span>
          <button class="copy-btn" onclick="copyText('captionText', this)">Copy</button>
        </div>
        <div class="output-body" id="captionText"></div>
      </div>

      <div class="output-section">
        <div class="output-header">
          <span class="output-label">Hashtag</span>
          <button class="copy-btn" onclick="copyText('hashtagText', this)">Copy</button>
        </div>
        <div class="output-body mono" id="hashtagText"></div>
      </div>

      <div class="output-section">
        <div class="output-header">
          <span class="output-label">Alt Text</span>
          <button class="copy-btn" onclick="copyText('altText', this)">Copy</button>
        </div>
        <div class="output-body mono alt-text" id="altText"></div>
      </div>
    </div>

    <!-- Panel: review -->
    <div class="output-panel" id="panel-review">
      <div id="profileBadge" style="display:none; font-size:9px; color:var(--violet); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:12px; padding:8px 12px; background:rgba(176,143,245,0.06); border:1px solid rgba(176,143,245,0.15); border-radius:6px;"></div>
      <button class="btn-review" id="reviewBtn" onclick="generateReview()">✦ Analizza e critica la caption</button>

      <div class="output-section" id="reviewSection" style="display:none; margin-top:16px;">
        <div class="review-score">
          <div class="score-number" id="scoreNumber">—</div>
          <div class="score-meta">
            <span class="score-label">Score / 10</span>
            <span class="score-verdict" id="scoreVerdict"></span>
          </div>
        </div>
        <div class="output-header">
          <span class="output-label">Analisi critica</span>
          <button class="copy-btn" onclick="copyText('reviewBody', this)">Copy</button>
        </div>
        <div class="review-body" id="reviewBody"></div>
        <div class="review-edit">
          <span class="review-edit-label">✦ Versione migliorata</span>
          <div id="reviewEdit"></div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
  let currentTab = 'instagram';
  let currentTone = 'amichevole';
  let uploadedImageBase64 = null;
  let uploadedImageType = null;

  // ─── Style Profile — apprendimento dalle review ───────────
  let styleProfile = JSON.parse(localStorage.getItem('miky4k_style_profile') || '{}');
  // styleProfile = { strengths: [], weaknesses: [], avoid: [], bestExamples: [] }

  function saveStyleProfile() {
    localStorage.setItem('miky4k_style_profile', JSON.stringify(styleProfile));
  }

  function getStyleProfilePrompt() {
    if (!styleProfile.strengths?.length && !styleProfile.weaknesses?.length) return '';
    let prompt = '\n\nPROFILO DI STILE APPRESO DALLE REVIEW PRECEDENTI (tienine conto per migliorare):';
    if (styleProfile.strengths?.length) prompt += `\nPunti di forza da mantenere: ${styleProfile.strengths.join('; ')}`;
    if (styleProfile.weaknesses?.length) prompt += `\nDebolezze ricorrenti da evitare: ${styleProfile.weaknesses.join('; ')}`;
    if (styleProfile.avoid?.length) prompt += `\nPattern da evitare: ${styleProfile.avoid.join('; ')}`;
    if (styleProfile.bestExamples?.length) prompt += `\nEsempio di caption eccellente da cui prendere ispirazione:\n"${styleProfile.bestExamples[styleProfile.bestExamples.length - 1]}"`;
    return prompt;
  }

  function setTab(tab) {
    currentTab = tab;
    document.getElementById('platform').value = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
  }

  function setOutputTab(tab) {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.output-panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
  }

  async function callAPI(body, retries = 3) {
    for (let i = 0; i < retries; i++) {
      const response = await fetch("https://miky4k-proxy.vercel.app/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await response.json();
      if (data.error?.type === 'overloaded_error') {
        if (i < retries - 1) {
          await new Promise(r => setTimeout(r, 2000 * (i + 1)));
          continue;
        }
        throw new Error('Server sovraccarico, riprova tra qualche secondo.');
      }
      if (!data.content || !Array.isArray(data.content)) {
        throw new Error(data.error?.message || JSON.stringify(data));
      }
      return data;
    }
  }

  async function generateReview() {
    const caption = document.getElementById('captionText').textContent.trim();
    if (!caption) return;

    const btn = document.getElementById('reviewBtn');
    btn.disabled = true;
    btn.textContent = '✦ analizzando...';
    document.getElementById('reviewSection').style.display = 'none';

    const systemPrompt = `Sei un direttore creativo brutalmente onesto specializzato in social media per artisti digitali. 
Il tuo compito è analizzare una caption Instagram/TikTok scritta per miky.4k, artista 3D della serie SOFT_STATE.
Rispondi SOLO con JSON valido, nessun testo aggiuntivo, nessun markdown, con questi campi:
- "score": numero intero da 1 a 10
- "verdict": una frase secca che riassume il giudizio (max 8 parole, in inglese)
- "analysis": analisi critica onesta in inglese — cosa funziona, cosa non funziona, perché. Sii diretto, non compiacente. Identifica le righe forti e quelle deboli. Max 120 parole.
- "improved": versione migliorata della caption, rispettando lo stesso scheletro (TITOLO / . / corpo / . / call to action) ma con le modifiche necessarie. In inglese.
- "strengths": array di 1-3 brevi stringhe in inglese che descrivono cosa ha funzionato bene (es. "strong opening hook", "specific visual metaphor").
- "weaknesses": array di 1-3 brevi stringhe in inglese che descrivono i punti deboli ricorrenti (es. "too many adjectives", "weak CTA").
- "avoid": array di 1-2 pattern specifici da evitare in futuro (es. "avoid starting with 'This is'", "avoid generic closing questions").`;

    try {
      const data = await callAPI({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1200,
        system: systemPrompt,
        messages: [{ role: "user", content: `Analizza questa caption:\n\n${caption}` }]
      });
      const raw = data.content.map(i => i.text || '').join('').trim();
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      document.getElementById('scoreNumber').textContent = parsed.score;
      document.getElementById('scoreVerdict').textContent = parsed.verdict;
      document.getElementById('reviewBody').textContent = parsed.analysis;
      document.getElementById('reviewEdit').textContent = parsed.improved;
      document.getElementById('reviewSection').style.display = 'block';

      // ─── Aggiorna il profilo di stile ───────────────────────
      if (!styleProfile.strengths) styleProfile.strengths = [];
      if (!styleProfile.weaknesses) styleProfile.weaknesses = [];
      if (!styleProfile.avoid) styleProfile.avoid = [];
      if (!styleProfile.bestExamples) styleProfile.bestExamples = [];

      // Aggiungi nuovi pattern, evita duplicati, max 6 per categoria
      if (parsed.strengths) {
        parsed.strengths.forEach(s => {
          if (!styleProfile.strengths.includes(s)) styleProfile.strengths.push(s);
        });
        styleProfile.strengths = styleProfile.strengths.slice(-6);
      }
      if (parsed.weaknesses) {
        parsed.weaknesses.forEach(w => {
          if (!styleProfile.weaknesses.includes(w)) styleProfile.weaknesses.push(w);
        });
        styleProfile.weaknesses = styleProfile.weaknesses.slice(-6);
      }
      if (parsed.avoid) {
        parsed.avoid.forEach(a => {
          if (!styleProfile.avoid.includes(a)) styleProfile.avoid.push(a);
        });
        styleProfile.avoid = styleProfile.avoid.slice(-4);
      }
      // Salva la caption migliorata se score >= 8
      if (parsed.score >= 8) {
        styleProfile.bestExamples.push(caption);
        styleProfile.bestExamples = styleProfile.bestExamples.slice(-3);
      }

      saveStyleProfile();
      updateProfileBadge();

    } catch (err) {
      console.error('Review error:', err);
      btn.textContent = 'errore: ' + err.message.slice(0, 40);
    } finally {
      btn.disabled = false;
      btn.textContent = '↺ Rigenera analisi';
    }
  }

  function updateProfileBadge() {
    const total = (styleProfile.strengths?.length || 0) +
                  (styleProfile.weaknesses?.length || 0) +
                  (styleProfile.avoid?.length || 0);
    const badge = document.getElementById('profileBadge');
    if (badge) {
      badge.textContent = total > 0 ? `✦ Profilo attivo (${total} pattern)` : '';
      badge.style.display = total > 0 ? 'block' : 'none';
    }
  }


  function setTone(tone, el) {
    currentTone = tone;
    document.querySelectorAll('.tone-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      uploadedImageBase64 = dataUrl.split(',')[1];
      uploadedImageType = file.type || 'image/jpeg';
      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('uploadZone').style.display = 'none';
      document.getElementById('previewWrap').style.display = 'block';
      document.getElementById('analyzeStatus').textContent = '';
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    uploadedImageBase64 = null;
    uploadedImageType = null;
    document.getElementById('imageInput').value = '';
    document.getElementById('previewImg').src = '';
    document.getElementById('uploadZone').style.display = 'block';
    document.getElementById('previewWrap').style.display = 'none';
    document.getElementById('analyzeStatus').textContent = '';
  }

  async function analyzeImage() {
    if (!uploadedImageBase64) return;
    const btn = document.getElementById('analyzeBtn');
    const status = document.getElementById('analyzeStatus');
    btn.disabled = true;
    status.textContent = 'analizzando...';

    const systemPrompt = `Sei un critico d'arte specializzato in arte digitale 3D. Analizza l'immagine fornita e rispondi SOLO con JSON valido, nessun testo aggiuntivo, nessun markdown.
Estrai questi campi:
- "concept": descrizione della scena in italiano, dettagliata, elementi visivi principali, atmosfera, simbolismo percepito (max 60 parole)
- "mood": 3-4 aggettivi separati da virgola che descrivono l'emozione dominante (in italiano)
- "title_suggestion": suggerimento breve per titolo in stile SOFT_STATE (es. "SOFT_STATE 005 — LIMINAL")`;

    try {
      const data = await callAPI({
        model: "claude-sonnet-4-20250514",
        max_tokens: 600,
        system: systemPrompt,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: uploadedImageType, data: uploadedImageBase64 } },
            { type: "text", text: "Analizza questa opera d'arte 3D e restituisci il JSON richiesto." }
          ]
        }]
      });
      const raw = data.content.map(i => i.text || '').join('').trim();
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      if (parsed.concept) {
        document.getElementById('concept').value = parsed.concept;
        document.getElementById('concept').parentElement.classList.add('field-autofilled');
      }
      if (parsed.mood) {
        document.getElementById('mood').value = parsed.mood;
        document.getElementById('mood').parentElement.classList.add('field-autofilled');
      }
      if (parsed.title_suggestion && !document.getElementById('title').value) {
        document.getElementById('title').value = parsed.title_suggestion;
      }

      status.textContent = '✦ campi compilati';
      status.style.color = 'var(--rose)';
    } catch (err) {
      status.textContent = 'errore: ' + err.message.slice(0, 50);
      status.style.color = 'var(--orange)';
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  async function generate() {
    const title = document.getElementById('title').value.trim();
    const contentType = document.getElementById('contentType').value;
    const concept = document.getElementById('concept').value.trim();
    const mood = document.getElementById('mood').value.trim();
    const software = document.getElementById('software').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const platform = currentTab;

    if (!concept) {
      alert('Inserisci almeno il concept della scena.');
      return;
    }

    document.getElementById('generateBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('output').style.display = 'none';

    const platformInstructions = {
      instagram: "Instagram post. Caption max 150 parole. Tono poetico, evocativo, personale. Puoi usare interruzioni di riga per respiro visivo. Includi un invito implicito all'interazione (non esplicito tipo 'commenta qui sotto'). Scrivi in inglese.",
      tiktok: "TikTok caption. Max 3 righe. Tono diretto, hook immediato nella prima riga. Deve fermare lo scroll. Scrivi in inglese."
    };

    const toneInstructions = {
      amichevole:  "Tono caldo e vicino, come parlare a un amico. Accessibile, mai freddo. Invita senza forzare.",
      poetico:     "Linguaggio poetico, ricco di immagini sospese e metafore visive. Frasi brevi alternate a frasi lunghe. Ritmo respirato.",
      pop:         "Energico, diretto, pensato per fermare lo scroll. Frasi corte e d'impatto. Può usare maiuscole o punteggiatura espressiva.",
      narrativo:   "Racconta una storia o un momento preciso legato all'opera. Come se stessi descrivendo un sogno o un ricordo.",
      concettuale: "Esplicita l'idea concettuale e il processo dietro l'opera. Tono riflessivo, quasi da statement artistico.",
      intimo:      "Voce in prima persona, confessionale. Come parlare sottovoce a qualcuno vicino. Vulnerabile e diretto.",
      minimalista: "Il minimo indispensabile. Una o due frasi al massimo. Ogni parola deve guadagnarsi il suo posto.",
      fresco:      "Leggero, spontaneo, contemporaneo. Tono giovane senza essere infantile. Come un pensiero detto al volo."
    };

    const systemPrompt = `Sei il copywriter ufficiale di miky.4k, artista digitale e graphic designer che produce arte 3D dark e onirica. 
La sua serie si chiama SOFT_STATE — esplora vulnerabilità, corpo, trascendenza, stati alterati di coscienza attraverso render 3D iperrealistici con lighting cinematografico.
Il tuo compito è generare 3 elementi distinti in formato JSON valido e niente altro:

1. "caption": testo caption per ${platform} — ${platformInstructions[platform]} — TONO RICHIESTO: ${toneInstructions[currentTone]}
   La caption DEVE seguire obbligatoriamente questo scheletro esatto, rispettando l'ordine e i punti separatori:

   TITOLO
   
   .
   
   corpo della caption
   
   .
   
   call to action

   Il TITOLO è il titolo dell'opera in maiuscolo. Il corpo è il testo principale nel tono richiesto. La call to action è implicita, mai banale, coerente con il tono scelto. Usa "." come separatore esatto tra le sezioni, su righe proprie.
   ${notes ? `\n   NOTE AGGIUNTIVE DA RISPETTARE: ${notes}` : ''}${getStyleProfilePrompt()}

2. "hashtags": array di esattamente 5 hashtag in inglese, mix di niche (arte 3D specifica) e medium (reach moderata). NO hashtag generico tipo #art #digital. Scegli hashtag realmente usati dalla community CG/3D art su Instagram.

3. "altText": testo alt per accessibilità, descrizione oggettiva e tecnica dell'immagine in inglese, max 2 frasi, inizia con "3D render of".

Rispondi SOLO con JSON valido, nessun testo aggiuntivo, nessun markdown.`;

    // Build messages — include image if uploaded
    const userContent = [];
    if (uploadedImageBase64) {
      userContent.push({ type: "image", source: { type: "base64", media_type: uploadedImageType, data: uploadedImageBase64 } });
    }
    userContent.push({ type: "text", text: `Opera: ${title || 'SOFT_STATE series'}
Tipo contenuto: ${contentType}
Concept: ${concept}
Mood: ${mood || 'non specificato'}
Software: ${software || 'non specificato'}
Piattaforma: ${platform}` });

    try {
      const data = await callAPI({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userContent }]
      });
      if (!data.content || !Array.isArray(data.content)) {
        throw new Error(data.error?.message || JSON.stringify(data));
      }
      const raw = data.content.map(i => i.text || '').join('').trim();
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      // Caption
      document.getElementById('captionText').textContent = parsed.caption;

      // Hashtags
      const tags = parsed.hashtags.map(h => h.startsWith('#') ? h : '#' + h);
      const hashtagEl = document.getElementById('hashtagText');
      hashtagEl.innerHTML = tags.map(h => `<span class="hashtag">${h}</span>`).join('  ');

      // Alt text
      document.getElementById('altText').textContent = parsed.altText;

      document.getElementById('output').style.display = 'block';

    } catch (err) {
      alert('Errore: ' + err.message);
      console.error(err);
    } finally {
      document.getElementById('generateBtn').disabled = false;
      document.getElementById('loading').style.display = 'none';
    }
  }

  function copyText(elementId, btn) {
    const el = document.getElementById(elementId);
    const text = el.innerText || el.textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Init
  updateProfileBadge();
</script>
</body>
</html>
